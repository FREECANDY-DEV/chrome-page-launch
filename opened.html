<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Chrome</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      background: #f4f1ea;
      color: #111;
    }
    main { max-width: 28rem; padding: 2rem; }
    h1 { font-weight: 500; font-size: 1.8rem; margin: 0 0 0.6rem; }
  </style>
</head>
<body>
  <main>
    <h1>New Chrome instance <span id="n"></span>.</h1>
    <p>Opened from the terminal because the other page was refreshed.</p>
  </main>
  <script>
    const n = new URLSearchParams(location.search).get("n") || "";
    document.getElementById("n").textContent = n;
  </script>
</body>
</html>
