<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Chrome</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      background: #111;
      color: #f4f1ea;
    }
    main { max-width: 28rem; padding: 2rem; }
    h1 { font-weight: 500; font-size: 1.8rem; margin: 0 0 0.6rem; }
    p { line-height: 1.5; color: #c8c2b4; }
  </style>
</head>
<body>
  <main>
    <h1>Visited.</h1>
    <p>Refresh this page. Each refresh opens a new Chrome from a terminal, and that terminal stays on screen.</p>
  </main>
</body>
</html>
